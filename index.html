<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5cff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Mis OR</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="brand"><div class="appicon">OR</div><div><h1>Mis OR</h1><div class="sub">Órdenes de requerimiento</div></div></div>
  <button id="installBtn" class="install hidden">📲 Instalar</button>
</header>
<main>
<section class="cards">
  <div class="card"><b id="total">0</b><span>Total OR</span></div>
  <div class="card danger"><b id="alerts">0</b><span>+30 días</span></div>
  <div class="card warning"><b id="recent">0</b><span>21–29 días</span></div>
</section>
<section class="panel searchpanel">
  <input id="search" placeholder="🔎 Buscar OR, proveedor o descripción..." autocomplete="off">
  <div class="filters">
    <button data-filter="all" class="active">Todas</button>
    <button data-filter="alert">🔴 +30 días</button>
    <button data-filter="recent">🟡 21–29 días</button>
  </div>
</section>
<section class="panel">
  <div class="actions">
    <button id="newBtn" class="primary">➕ Nueva OR</button>
    <label class="button secondary">📥 Excel<input id="excelInput" type="file" accept=".xlsx,.xls" hidden></label>
    <button id="backupBtn" class="secondary">💾 Respaldo</button>
    <label class="button secondary">♻️ Restaurar<input id="restoreInput" type="file" accept=".json" hidden></label>
  </div>
  <p class="hint">Las nuevas OR se agregan. Importar Excel no borra las OR existentes.</p>
</section>
<section id="list" class="list"></section>
</main>
<div id="modal" class="modal hidden">
 <div class="modalbox">
  <div class="modalhead"><h2>Nueva OR</h2><button id="closeModal" aria-label="Cerrar">✕</button></div>
  <form id="orForm">
   <label>Número de OR<input id="f_num" required inputmode="numeric"></label>
   <label>Descripción<input id="f_desc"></label>
   <label>Proveedor<input id="f_prov"></label>
   <label>Fecha de creación<input id="f_date" type="date" required></label>
   <label>Fecha entrega prometida<input id="f_due" type="date"></label>
   <label>Estado<input id="f_state" placeholder="Pendiente"></label>
   <label>Observaciones<textarea id="f_obs"></textarea></label>
   <button type="submit" class="primary full">Guardar OR</button>
  </form>
 </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
